{{- /* Structured data (JSON-LD) for richer search results. */ -}}

{{- if .IsHome -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Planfree.dev",
  "url": {{ site.BaseURL | jsonify }},
  "applicationCategory": "BusinessApplication",
  "operatingSystem": "Web",
  "browserRequirements": "Requires JavaScript",
  "description": {{ site.Params.metadata.description | jsonify }},
  "image": {{ site.Params.metadata.image | jsonify }},
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "author": {
    "@type": "Person",
    "name": {{ site.Params.metadata.author | jsonify }}
  }
}
</script>
{{- with .Params.faqs }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{- range $i, $faq := . }}{{ if $i }},{{ end }}
    {
      "@type": "Question",
      "name": {{ $faq.question | jsonify }},
      "acceptedAnswer": { "@type": "Answer", "text": {{ $faq.answer | jsonify }} }
    }
    {{- end }}
  ]
}
</script>
{{- end -}}
{{- end -}}

{{- if and .IsPage (eq .Section "blog") -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ .Title | jsonify }},
  "description": {{ .Params.description | jsonify }},
  "datePublished": {{ .Date.Format "2006-01-02" | jsonify }},
  "dateModified": {{ .Lastmod.Format "2006-01-02" | jsonify }},
  "author": {
    "@type": "Person",
    "name": {{ .Params.author | default site.Params.metadata.author | jsonify }}
  },
  "mainEntityOfPage": {{ .Permalink | jsonify }},
  "publisher": {
    "@type": "Organization",
    "name": "Planfree.dev",
    "url": {{ site.BaseURL | jsonify }}
  }
}
</script>
{{- end -}}
